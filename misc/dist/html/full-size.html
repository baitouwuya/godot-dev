<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root {
	--splash-bg: $GODOT_SPLASH_COLOR;
	--surface-card: rgba(18, 20, 26, 0.88);
	--surface-border: rgba(255, 255, 255, 0.10);
	--text-primary: #f3f4f6;
	--text-muted: rgba(243, 244, 246, 0.62);
	--accent: #478cbf;
	--accent-glow: rgba(71, 140, 191, 0.35);
	--danger-bg: rgba(28, 16, 20, 0.94);
	--danger-border: rgba(239, 68, 68, 0.38);
	--danger-accent: #f87171;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
	width: 100%;
	height: 100%;
}

body {
	color: var(--text-primary);
	background-color: #090a0d;
	overflow: hidden;
	touch-action: none;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
	-webkit-font-smoothing: antialiased;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	inset: 0;
	background-color: var(--splash-bg);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	opacity: 1;
	transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1);
	z-index: 10;
}

#status.is-hiding {
	opacity: 0;
	pointer-events: none;
}

#status-splash {
	max-height: 68%;
	max-width: 78%;
	margin: auto;
	user-select: none;
	-webkit-user-drag: none;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	position: absolute;
	inset: 0;
	max-height: 100%;
	max-width: 100%;
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-hud {
	position: absolute;
	bottom: clamp(28px, 7vh, 64px);
	width: min(440px, calc(100vw - 48px));
	display: none;
	flex-direction: column;
	gap: 9px;
	z-index: 2;
}

#status-meta {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 12px;
	font-size: 12px;
	letter-spacing: 0.02em;
	color: var(--text-muted);
	font-variant-numeric: tabular-nums;
}

#status-percent {
	font-size: 13px;
	font-weight: 600;
	color: var(--text-primary);
	font-variant-numeric: tabular-nums;
	letter-spacing: 0.02em;
}

#status-backend {
	display: inline-flex;
	align-items: center;
	gap: 6px;
	padding: 2px 9px;
	border-radius: 999px;
	background: var(--surface-card);
	border: 1px solid var(--surface-border);
	color: var(--text-primary);
	font-size: 11px;
	font-weight: 500;
	backdrop-filter: blur(8px);
}

#status-backend::before {
	content: "";
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: var(--accent);
	box-shadow: 0 0 8px var(--accent-glow);
}

#status-track {
	position: relative;
	width: 100%;
	height: 5px;
	border-radius: 999px;
	background: rgba(255, 255, 255, 0.12);
	overflow: hidden;
}

#status-bar {
	height: 100%;
	width: 0%;
	border-radius: 999px;
	background: linear-gradient(90deg, #3b82f6, #60a5fa, #38bdf8);
	box-shadow: 0 0 10px rgba(96, 165, 250, 0.4);
	will-change: width;
}

#status-bar.is-ready {
	background: linear-gradient(90deg, #3b82f6, #38bdf8, #34d399);
	box-shadow: 0 0 12px rgba(52, 211, 153, 0.45);
}

#status-track.is-indeterminate #status-bar {
	width: 36%;
	animation: status-slide 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}

#status-phase-row {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 12px;
	font-size: 12px;
	color: var(--text-muted);
	font-variant-numeric: tabular-nums;
}

#status-phase {
	display: inline-flex;
	align-items: center;
	gap: 7px;
	min-width: 0;
}

#status-phase-dot {
	flex-shrink: 0;
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: #60a5fa;
	box-shadow: 0 0 8px rgba(96, 165, 250, 0.7);
	animation: stream-pulse 1.2s ease-in-out infinite;
}

#status-phase-dot.is-ready {
	background: #34d399;
	box-shadow: 0 0 8px rgba(52, 211, 153, 0.75);
	animation: none;
}

#status-label {
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

#status-detail {
	flex-shrink: 0;
	font-size: 11px;
	color: rgba(243, 244, 246, 0.50);
}

@keyframes status-slide {
	0% { transform: translateX(-110%); }
	100% { transform: translateX(300%); }
}

#status-progress {
	position: absolute;
	width: 1px;
	height: 1px;
	opacity: 0;
	pointer-events: none;
}

#status-notice {
	display: none;
	max-width: min(520px, calc(100vw - 40px));
	background: var(--danger-bg);
	border: 1px solid var(--danger-border);
	border-radius: 12px;
	box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55);
	padding: 20px 24px;
	text-align: left;
	z-index: 3;
	backdrop-filter: blur(12px);
}

#status-notice-title {
	display: flex;
	align-items: center;
	gap: 8px;
	font-size: 14px;
	font-weight: 600;
	color: var(--danger-accent);
	margin-bottom: 8px;
}

#status-notice-body {
	font-size: 13px;
	line-height: 1.55;
	color: rgba(243, 244, 246, 0.86);
	white-space: pre-wrap;
	word-break: break-word;
}

#stream-pill {
	position: fixed;
	top: 14px;
	right: 14px;
	display: none;
	flex-direction: column;
	gap: 6px;
	min-width: 220px;
	padding: 8px 12px;
	border-radius: 10px;
	background: var(--surface-card);
	border: 1px solid var(--surface-border);
	box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
	backdrop-filter: blur(10px);
	pointer-events: none;
	opacity: 1;
	transition: opacity 0.35s ease;
	z-index: 9;
}

#stream-pill.is-done {
	opacity: 0;
}

#stream-pill-row {
	display: flex;
	justify-content: space-between;
	align-items: center;
	gap: 12px;
	font-size: 11px;
	font-weight: 500;
	color: var(--text-primary);
	font-variant-numeric: tabular-nums;
}

#stream-pill-title {
	display: inline-flex;
	align-items: center;
	gap: 6px;
}

#stream-pill-dot {
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: #60a5fa;
	box-shadow: 0 0 8px rgba(96, 165, 250, 0.7);
	animation: stream-pulse 1.2s ease-in-out infinite;
}

@keyframes stream-pulse {
	0%, 100% { opacity: 1; transform: scale(1); }
	50% { opacity: 0.45; transform: scale(0.82); }
}

#stream-pill-count {
	color: var(--text-muted);
}

#stream-pill-track {
	width: 100%;
	height: 3px;
	border-radius: 999px;
	background: rgba(255, 255, 255, 0.12);
	overflow: hidden;
}

#stream-pill-bar {
	height: 100%;
	width: 0%;
	border-radius: 999px;
	background: linear-gradient(90deg, #3b82f6, #38bdf8);
	will-change: width;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the HTML5 canvas element.
		</canvas>

		<noscript>
			JavaScript is required to run this application.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div id="status-hud">
				<div id="status-meta">
					<span id="status-backend">Initializing</span>
					<span id="status-percent">0%</span>
				</div>
				<div id="status-track" class="is-indeterminate">
					<div id="status-bar"></div>
				</div>
				<div id="status-phase-row">
					<span id="status-phase"><span id="status-phase-dot"></span><span id="status-label">Preparing runtime…</span></span>
					<span id="status-detail"></span>
				</div>
				<progress id="status-progress"></progress>
			</div>
			<div id="status-notice" role="alert">
				<div id="status-notice-title">Unable to Start Application</div>
				<div id="status-notice-body"></div>
			</div>
		</div>

		<div id="stream-pill" aria-live="polite">
			<div id="stream-pill-row">
				<span id="stream-pill-title"><span id="stream-pill-dot"></span><span id="stream-pill-text">Streaming HD Textures</span></span>
				<span id="stream-pill-count">0%</span>
			</div>
			<div id="stream-pill-track">
				<div id="stream-pill-bar"></div>
			</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusHud = document.getElementById('status-hud');
	const statusTrack = document.getElementById('status-track');
	const statusBar = document.getElementById('status-bar');
	const statusProgress = document.getElementById('status-progress');
	const statusBackend = document.getElementById('status-backend');
	const statusPercent = document.getElementById('status-percent');
	const statusPhaseDot = document.getElementById('status-phase-dot');
	const statusLabel = document.getElementById('status-label');
	const statusDetail = document.getElementById('status-detail');
	const statusNotice = document.getElementById('status-notice');
	const statusNoticeBody = document.getElementById('status-notice-body');
	const streamPill = document.getElementById('stream-pill');
	const streamPillText = document.getElementById('stream-pill-text');
	const streamPillCount = document.getElementById('stream-pill-count');
	const streamPillBar = document.getElementById('stream-pill-bar');

	const isZh = /^zh\b/i.test((navigator.language || (navigator.languages && navigator.languages[0]) || ''));

	const PHASE_META = {
		'init': { step: '1/6', ceiling: 0.04, zh: '正在准备运行环境…', en: 'Preparing runtime…' },
		'wasm': { step: '1/6', ceiling: 0.24, zh: '正在下载引擎核心 (WASM)', en: 'Downloading engine core (WASM)' },
		'wasm_init': { step: '1/6', ceiling: 0.26, zh: '正在编译运行时与解析资源索引', en: 'Initializing runtime & pack index' },
		'pack_stream': { step: '2/6', ceiling: 0.50, zh: '正在流式拉取启动资源 (PCK)', en: 'Streaming boot assets (PCK)' },
		'pack': { step: '2/6', ceiling: 0.50, zh: '正在下载项目资源包 (PCK)', en: 'Downloading project pack (PCK)' },
		'renderer': { step: '3/6', ceiling: 0.55, zh: '正在初始化渲染设备与文件系统', en: 'Initializing renderer & filesystem' },
		'engine': { step: '4/6', ceiling: 0.74, zh: '正在初始化渲染服务与着色器', en: 'Initializing servers & shaders' },
		'scene': { step: '5/6', ceiling: 0.91, zh: '正在加载场景与常驻资源', en: 'Loading scene & resident assets' },
		'pipelines': { step: '6/6', ceiling: 0.985, zh: '正在编译首帧渲染管线', en: 'Compiling first-frame GPU pipelines' },
		'ready': { step: '6/6', ceiling: 1.0, zh: '加载完成 · 即将进入场景', en: 'Ready · Entering scene' },
	};

	let initializing = true;
	let statusMode = '';
	let targetRatio = 0;
	let displayRatio = 0;
	let hasDeterminateProgress = false;
	let currentPhase = 'init';
	let currentPhaseFallback = '';
	let currentBytesLoaded = 0;
	let currentBytesTotal = 0;
	let isCompleting = false;
	let completionScheduled = false;
	let progressRaf = 0;
	let lastProgressTick = 0;

	let streamHideTimer = null;
	let streamTargetRatio = 0;
	let streamDisplayRatio = 0;
	let streamLatestState = null;
	let streamRaf = 0;
	let lastStreamTick = 0;

	function formatMB(bytes) {
		return (bytes / (1024 * 1024)).toFixed(1);
	}

	function resolvePhase(startup, ratio) {
		if (startup && startup['phase'] && PHASE_META[startup['phase']]) {
			return startup['phase'];
		}
		const text = (startup && startup['label'] ? String(startup['label']) : '').toLowerCase();
		if (text.includes('ready') || ratio >= 0.999) {
			return 'ready';
		}
		if (text.includes('first frame') || text.includes('pipeline')) {
			return 'pipelines';
		}
		if (text.includes('scene') || text.includes('resident')) {
			return 'scene';
		}
		if (text.includes('shader') || text.includes('initializing renderer')) {
			return 'engine';
		}
		if (text.includes('browser renderer') || text.includes('starting engine')) {
			return 'renderer';
		}
		if (text.includes('stream')) {
			return 'pack_stream';
		}
		if (text.includes('pack') || text.includes('project')) {
			return 'pack';
		}
		if (text.includes('wasm') || text.includes('engine core')) {
			return 'wasm';
		}
		if (ratio >= 0.91) {
			return 'pipelines';
		}
		if (ratio >= 0.74) {
			return 'scene';
		}
		if (ratio >= 0.55) {
			return 'engine';
		}
		if (ratio >= 0.50) {
			return 'renderer';
		}
		if (ratio > 0.25) {
			return 'pack_stream';
		}
		return ratio > 0 ? 'wasm' : 'init';
	}

	function renderProgressUI() {
		const meta = PHASE_META[currentPhase] || PHASE_META['init'];
		const phaseText = (isZh ? meta.zh : meta.en) || currentPhaseFallback;
		statusLabel.textContent = phaseText;
		if (currentBytesTotal > 0 && (currentPhase === 'wasm' || currentPhase === 'pack' || currentPhase === 'pack_stream')) {
			statusDetail.textContent = formatMB(currentBytesLoaded) + ' / ' + formatMB(currentBytesTotal) + ' MB';
		} else if (currentPhase === 'ready') {
			statusDetail.textContent = isZh ? '完成' : 'Done';
		} else {
			statusDetail.textContent = (isZh ? '阶段 ' : 'Step ') + meta.step;
		}
		if (!hasDeterminateProgress) {
			statusTrack.classList.add('is-indeterminate');
			statusPercent.textContent = '…';
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
			return;
		}
		statusTrack.classList.remove('is-indeterminate');
		const clamped = Math.max(0, Math.min(1, displayRatio));
		const pct = Math.round(clamped * 100);
		statusBar.style.width = (clamped * 100).toFixed(2) + '%';
		statusPercent.textContent = pct + '%';
		statusProgress.value = pct;
		statusProgress.max = 100;
		const isDoneVisual = isCompleting && clamped >= 0.999;
		statusBar.classList.toggle('is-ready', isDoneVisual);
		statusPhaseDot.classList.toggle('is-ready', isDoneVisual);
	}

	function tickProgress(now) {
		progressRaf = 0;
		if (!initializing) {
			return;
		}
		const dt = lastProgressTick ? Math.min(0.05, Math.max(0.001, (now - lastProgressTick) / 1000)) : 0.016;
		lastProgressTick = now;

		if (hasDeterminateProgress) {
			const meta = PHASE_META[currentPhase] || PHASE_META['init'];
			const ceiling = isCompleting ? 1.0 : Math.max(targetRatio, meta.ceiling);
			if (!isCompleting && targetRatio < ceiling && currentPhase !== 'wasm' && currentPhase !== 'pack' && currentPhase !== 'pack_stream') {
				// Subtle asymptotic creep within the active stage ceiling while async work runs.
				targetRatio = Math.min(ceiling - 0.004, targetRatio + (ceiling - targetRatio) * dt * 0.08);
			}
			const speed = isCompleting ? 12.0 : 8.5;
			const alpha = 1 - Math.exp(-dt * speed);
			const diff = targetRatio - displayRatio;
			if (Math.abs(diff) < 0.0012) {
				displayRatio = targetRatio;
			} else {
				displayRatio += diff * alpha;
			}
		}

		renderProgressUI();

		if (isCompleting && displayRatio >= 0.9985) {
			displayRatio = 1.0;
			renderProgressUI();
			if (!completionScheduled) {
				completionScheduled = true;
				setTimeout(() => {
					setStatusMode('hidden');
					if (window['godotStreamState']) {
						updateStreamPill(window['godotStreamState']);
					}
				}, 140);
			}
			return;
		}

		if (initializing) {
			progressRaf = requestAnimationFrame(tickProgress);
		}
	}

	function ensureProgressLoop() {
		if (!progressRaf && initializing) {
			lastProgressTick = performance.now();
			progressRaf = requestAnimationFrame(tickProgress);
		}
	}

	function completeLoading() {
		refreshBackendBadge();
		hasDeterminateProgress = true;
		currentPhase = 'ready';
		currentBytesLoaded = 0;
		currentBytesTotal = 0;
		targetRatio = 1.0;
		isCompleting = true;
		ensureProgressLoop();
	}

	function renderStreamPill() {
		if (!streamLatestState) {
			return;
		}
		const done = streamLatestState['completed'] || 0;
		const failed = streamLatestState['failed'] || 0;
		const total = streamLatestState['total'] || 0;
		const clamped = Math.max(0, Math.min(1, streamDisplayRatio));
		const pct = Math.round(clamped * 100);
		streamPillBar.style.width = (clamped * 100).toFixed(2) + '%';
		streamPillCount.textContent = done + ' / ' + total + ' · ' + pct + '%';
		if (done + failed >= total && !streamLatestState['active'] && clamped >= 0.998) {
			streamPillBar.style.width = '100%';
			streamPillCount.textContent = done + ' / ' + total + ' · 100%';
			streamPillText.textContent = isZh ? '高清纹理已就绪' : 'HD Textures Ready';
			if (!streamHideTimer) {
				streamHideTimer = setTimeout(() => {
					streamPill.classList.add('is-done');
					setTimeout(() => {
						streamPill.style.display = 'none';
					}, 380);
				}, 1400);
			}
		} else {
			streamPillText.textContent = isZh ? '正在流式加载高清纹理' : 'Streaming HD Textures';
		}
	}

	function tickStreamPill(now) {
		streamRaf = 0;
		const dt = lastStreamTick ? Math.min(0.05, Math.max(0.001, (now - lastStreamTick) / 1000)) : 0.016;
		lastStreamTick = now;
		const alpha = 1 - Math.exp(-dt * 10.0);
		const diff = streamTargetRatio - streamDisplayRatio;
		if (Math.abs(diff) < 0.0015) {
			streamDisplayRatio = streamTargetRatio;
		} else {
			streamDisplayRatio += diff * alpha;
		}
		renderStreamPill();
		if (Math.abs(streamTargetRatio - streamDisplayRatio) >= 0.0015) {
			streamRaf = requestAnimationFrame(tickStreamPill);
		}
	}

	function updateStreamPill(state) {
		if (!state || !state['total'] || state['total'] <= 0) {
			return;
		}
		streamLatestState = state;
		const done = state['completed'] || 0;
		const failed = state['failed'] || 0;
		const total = state['total'];
		const isFinished = done + failed >= total && !state['active'];
		const byteRatio = state['bytesTotal'] > 0 ? (state['bytesLoaded'] / state['bytesTotal']) : (done / total);
		streamTargetRatio = isFinished ? 1.0 : Math.max(streamTargetRatio, Math.min(0.995, Math.max(done / total, byteRatio)));
		streamPill.style.display = 'flex';
		if (!streamRaf) {
			lastStreamTick = performance.now();
			streamRaf = requestAnimationFrame(tickStreamPill);
		}
	}

	window['onGodotStreamProgress'] = updateStreamPill;

	function formatBackendBadge(info) {
		if (!info || !info.driver) {
			const targetDriver = GODOT_CONFIG['renderingDriver'] || 'opengl3';
			return targetDriver === 'webgpu' ? 'WebGPU' : 'WebGL 2';
		}
		if (info.driver === 'webgpu') {
			const tier = info.method === 'forward_plus' ? 'Forward+' : 'Mobile';
			return 'WebGPU · ' + tier;
		}
		if (info.driver === 'opengl3') {
			return 'WebGL 2 · Compatibility';
		}
		return info.driver;
	}

	function refreshBackendBadge() {
		const info = (typeof engine.getRenderingBackend === 'function' && engine.getRenderingBackend()) || window['godotRenderingBackend'];
		statusBackend.textContent = formatBackendBadge(info);
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			refreshBackendBadge();
			statusOverlay.classList.add('is-hiding');
			initializing = false;
			if (progressRaf) {
				cancelAnimationFrame(progressRaf);
				progressRaf = 0;
			}
			setTimeout(() => {
				statusOverlay.remove();
			}, 240);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusHud.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function displayFailureNotice(err) {
		console.error(err && err.stack ? err.stack : err);
		let msg = 'An unexpected runtime error occurred.';
		if (err instanceof Error) {
			msg = err.message;
		} else if (typeof err === 'string') {
			msg = err;
		}
		statusNoticeBody.textContent = msg;
		setStatusMode('notice');
		initializing = false;
		if (progressRaf) {
			cancelAnimationFrame(progressRaf);
			progressRaf = 0;
		}
	}

	refreshBackendBadge();
	renderProgressUI();

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'The following browser features required to run this project are unavailable:\n\n• ' + missing.join('\n• ');
			displayFailureNotice(missingMsg);
		}
	} else {
		setStatusMode('progress');
		ensureProgressLoop();
		engine.startGame({
			'progressiveTextureMips': !GODOT_THREADS_ENABLED,
			'onProgress': function (current, total) {
				refreshBackendBadge();
				const startup = window['godotStartupStatus'];
				if ((current > 0 && total > 0) || (startup && startup['ratio'] > 0)) {
					const rawRatio = total > 0 ? (current / total) : (startup ? startup['ratio'] : 0);
					const nextRatio = Math.min(1, Math.max(0, rawRatio));
					hasDeterminateProgress = true;
					targetRatio = Math.max(targetRatio, nextRatio);
					currentPhase = resolvePhase(startup, targetRatio);
					currentPhaseFallback = (startup && startup['label']) ? String(startup['label']).replace(/(\.\.\.|…)$/, '') : '';
					currentBytesLoaded = (startup && startup['bytesLoaded']) || 0;
					currentBytesTotal = (startup && startup['bytesTotal']) || 0;
					if (currentPhase === 'ready' || targetRatio >= 0.999) {
						isCompleting = true;
					}
					renderProgressUI();
					ensureProgressLoop();
				} else {
					renderProgressUI();
				}
			},
		}).then(completeLoading, displayFailureNotice);
	}
}());
		</script>
	</body>
